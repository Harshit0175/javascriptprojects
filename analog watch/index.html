<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Clock</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #302d2d;
      margin: 0;
    }

    .clock {
      width: 300px;
      height: 300px;
      background: #888787;
      border: 10px solid #333;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      transform: rotate(-90deg);
      
    }

    .number {
      position: absolute;
      left: 48%;
      top: 47%;
      transform: translate(-50%, -50%);
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .number1  { transform: rotate(30deg)   translate(130px) rotate(60deg); }
    .number2  { transform: rotate(60deg)   translate(130px) rotate(30deg); }
    .number3  { transform: rotate(90deg)   translate(130px) rotate(0deg); }
    .number4  { transform: rotate(120deg)  translate(130px) rotate(-20deg);}
    .number5  { transform: rotate(150deg)  translate(130px) rotate(-60deg);}
    .number6  { transform: rotate(180deg)  translate(130px) rotate(-90deg);}
    .number7  { transform: rotate(210deg)  translate(130px) rotate(-120deg);}
    .number8  { transform: rotate(240deg)  translate(130px) rotate(-150deg);}
    .number9  { transform: rotate(270deg)  translate(130px) rotate(-180deg);}
    .number10 { transform: rotate(300deg)  translate(130px) rotate(-210deg);}
    .number11 { transform: rotate(330deg)  translate(130px) rotate(-240deg);}
    .number12 { transform: rotate(0deg)    translate(130px) rotate(-270deg);}

    .center {
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .hand {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: 0% 50%;
      transform: rotate(90deg);
      transition: all 0.05s ease-in-out;
    }

    .hour {
      width: 80px;
      height: 6px;
      background: black;
      z-index: 3;
    }

    .minute {
      width: 110px;
      height: 4px;
      background: #333;
      z-index: 2;
    }

    .second {
      width: 130px;
      height: 2px;
      background: red;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="clock">
    <div class="number number1">1</div>
    <div class="number number2">2</div>
    <div class="number number3">3</div>
    <div class="number number4">4</div>
    <div class="number number5">5</div>
    <div class="number number6">6</div>
    <div class="number number7">7</div>
    <div class="number number8">8</div>
    <div class="number number9">9</div>
    <div class="number number10">10</div>
    <div class="number number11">11</div>
    <div class="number number12">12</div>
    <div class="center"></div>
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
  </div>

  <script src="index.js"></script>
  
</body>
</html>
